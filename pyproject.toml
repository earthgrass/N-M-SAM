[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nmsam-rebuild"
version = "0.1.0"
description = "Isolated PyTorch semantic port of Google SAM and N:M research foundation"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "torchvision>=0.19", "PyYAML>=6", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

